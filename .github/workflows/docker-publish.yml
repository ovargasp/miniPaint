name: Build and Publish Docker Image

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # Permite compilar manualmente con un botón

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generamos el Dockerfile que le falta al repositorio oficial
      - name: Inject Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          # Etapa 1: Compilar la aplicación
          FROM node:18-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm install
          COPY . .
          RUN npm run build

          # Etapa 2: Servidor web ultra-ligero para producción
          FROM nginx:alpine
          COPY --from=builder /app /usr/share/nginx/html
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      # Paso clave: Convierte el nombre del usuario y repositorio a minúsculas obligatoriamente
      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
